<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MysteryScene</title>
    <style>
      /* 배포용 데모 페이지의 전체 색상/간격 토큰 */
      :root {
        color-scheme: dark;
        --bg: #101311;
        --surface: #171b18;
        --surface-2: #202721;
        --surface-3: #263127;
        --ink: #f4f1e8;
        --muted: #b9b5a8;
        --soft: #8e978d;
        --line: #3a453d;
        --gold: #d7ad57;
        --gold-2: #f0ca72;
        --green: #8fd0a0;
        --red: #ef9d91;
        --blue: #9fbfe8;
        --shadow: rgba(0, 0, 0, 0.28);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
      }

      body {
        margin: 0;
        min-height: 100%;
        overflow: hidden;
        background:
          linear-gradient(rgba(16, 19, 17, 0.84), rgba(16, 19, 17, 0.92)),
          url("/assets/evidence/memo-clue.png") center 16% / cover fixed,
          var(--bg);
        color: var(--ink);
        font-family: Arial, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      }

      button,
      textarea,
      input {
        font: inherit;
      }

      button {
        min-height: 38px;
        border: 0;
        border-radius: 8px;
        background: var(--gold);
        color: #181208;
        cursor: pointer;
        font-weight: 700;
        padding: 9px 13px;
        transition:
          background 140ms ease,
          transform 140ms ease,
          border-color 140ms ease;
      }

      button:hover {
        background: var(--gold-2);
        transform: translateY(-1px);
      }

      button:disabled {
        cursor: wait;
        opacity: 0.62;
        transform: none;
      }

      button.secondary,
      button.quick {
        border: 1px solid var(--line);
        background: var(--surface-2);
        color: var(--ink);
      }

      button.secondary:hover,
      button.quick:hover {
        border-color: rgba(215, 173, 87, 0.68);
        background: var(--surface-3);
      }

      button.submit {
        background: var(--green);
        color: #0b1a10;
      }

      button.submit:hover {
        background: #afe7bc;
      }

      textarea,
      input {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #0f1411;
        color: var(--ink);
      }

      textarea {
        min-height: 86px;
        max-height: 180px;
        resize: vertical;
        padding: 13px 14px;
        line-height: 1.55;
      }

      textarea:focus,
      input:focus {
        border-color: var(--gold);
        outline: 2px solid rgba(215, 173, 87, 0.22);
      }

      .shell {
        display: grid;
        grid-template-rows: auto minmax(0, 1fr);
        height: 100dvh;
        width: min(1360px, calc(100% - 28px));
        margin: 0 auto;
        padding: 18px 0;
      }

      .topbar {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: end;
        gap: 18px;
        padding: 10px 0 16px;
      }

      .brand h1 {
        margin: 0;
        font-size: 26px;
        letter-spacing: 0;
      }

      .brand p {
        max-width: 820px;
        margin: 7px 0 0;
        color: var(--muted);
        line-height: 1.55;
      }

      .server-badge {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        min-height: 34px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: rgba(23, 27, 24, 0.9);
        color: var(--muted);
        padding: 8px 11px;
        white-space: nowrap;
      }

      .server-dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: var(--soft);
      }

      .server-badge.online .server-dot {
        background: var(--green);
        box-shadow: 0 0 0 3px rgba(143, 208, 160, 0.15);
      }

      .server-badge.offline .server-dot {
        background: var(--red);
        box-shadow: 0 0 0 3px rgba(239, 157, 145, 0.14);
      }

      /* 실제 플레이 영역: 채팅은 왼쪽, 사건 보드는 오른쪽 */
      .layout {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 390px;
        gap: 18px;
        align-items: stretch;
        min-height: 0;
      }

      .play-panel,
      .case-panel {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: rgba(23, 27, 24, 0.94);
        box-shadow: 0 18px 44px var(--shadow);
        min-height: 0;
        overflow: hidden;
      }

      .play-panel {
        display: grid;
        grid-template-rows: auto minmax(0, 1fr) auto;
        height: 100%;
      }

      .panel-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        border-bottom: 1px solid var(--line);
        background: rgba(32, 39, 33, 0.82);
        padding: 13px 15px;
      }

      .panel-title {
        min-width: 0;
      }

      .panel-title strong {
        display: block;
        overflow-wrap: anywhere;
        font-size: 16px;
      }

      .panel-title span {
        display: block;
        margin-top: 4px;
        color: var(--soft);
        font-size: 13px;
      }

      .pill-row {
        display: flex;
        flex-wrap: wrap;
        gap: 7px;
      }

      .pill {
        display: inline-flex;
        align-items: center;
        min-height: 28px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: #121713;
        color: var(--muted);
        font-size: 12px;
        font-weight: 700;
        padding: 5px 9px;
      }

      .pill.ok {
        border-color: rgba(143, 208, 160, 0.55);
        color: var(--green);
      }

      .pill.warn {
        border-color: rgba(215, 173, 87, 0.55);
        color: var(--gold-2);
      }

      .pill.error {
        border-color: rgba(239, 157, 145, 0.55);
        color: var(--red);
      }

      /* 채팅 메시지 목록과 사용자/조사관 말풍선 */
      .messages {
        display: flex;
        flex-direction: column;
        gap: 12px;
        min-height: 0;
        overflow: auto;
        overscroll-behavior: contain;
        padding: 16px;
        scroll-behavior: smooth;
      }

      .message {
        width: min(82%, 760px);
        border: 1px solid var(--line);
        border-radius: 8px;
        line-height: 1.62;
        overflow-wrap: anywhere;
        padding: 13px 14px;
        white-space: pre-wrap;
      }

      .message.assistant {
        align-self: flex-start;
        background: #121713;
      }

      .message.user {
        align-self: flex-end;
        border-color: rgba(215, 173, 87, 0.46);
        background: #262111;
      }

      .message.system {
        align-self: center;
        width: min(94%, 820px);
        border-color: rgba(159, 191, 232, 0.35);
        background: rgba(18, 27, 36, 0.9);
        color: #dce9fa;
      }

      .message-media {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 10px;
        margin-top: 12px;
      }

      .message-media img,
      .evidence-image,
      .scene-image {
        display: block;
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 8px;
        object-fit: cover;
      }

      .message-media img {
        aspect-ratio: 4 / 3;
      }

      /* 질문 입력부: 데모에서는 단축 버튼 없이 직접 입력만 받는다. */
      .composer {
        border-top: 1px solid var(--line);
        background: rgba(20, 24, 21, 0.98);
        padding: 13px;
      }

      .composer-actions {
        display: flex;
        justify-content: flex-end;
        gap: 9px;
        margin-top: 10px;
      }

      /* 오른쪽 사건 보드: 진행도, 힌트 펼침, 확보 단서 목록 */
      .case-panel {
        display: grid;
        grid-template-rows: auto auto minmax(0, 1fr);
        height: 100%;
      }

      .visual-strip {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0;
        border-bottom: 1px solid var(--line);
      }

      .visual-strip img {
        width: 100%;
        height: 142px;
        object-fit: cover;
      }

      .case-body {
        min-height: 0;
        overflow: auto;
        overscroll-behavior: contain;
        padding: 14px;
      }

      .case-copy {
        color: var(--muted);
        line-height: 1.58;
        margin: 0 0 14px;
      }

      .progress-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 9px;
        margin: 12px 0;
      }

      .metric {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #111713;
        padding: 10px;
      }

      .metric span {
        display: block;
        color: var(--soft);
        font-size: 12px;
      }

      .metric strong {
        display: block;
        margin-top: 4px;
        font-size: 19px;
      }

      .section-title {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin: 16px 0 9px;
      }

      .section-title h2 {
        margin: 0;
        font-size: 15px;
      }

      /* 막힌 사람만 펼쳐보는 조사 흐름 안내 */
      .flow-disclosure {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #111713;
        margin-top: 16px;
        overflow: hidden;
      }

      .flow-disclosure summary {
        cursor: pointer;
        color: var(--muted);
        font-weight: 700;
        list-style-position: inside;
        padding: 12px;
      }

      .flow-disclosure summary:hover {
        color: var(--gold-2);
      }

      .flow-disclosure .steps {
        border-top: 1px solid var(--line);
        padding: 12px;
      }

      .steps {
        display: grid;
        gap: 8px;
      }

      .step {
        display: grid;
        grid-template-columns: 25px minmax(0, 1fr);
        gap: 9px;
        align-items: start;
        color: var(--muted);
        line-height: 1.42;
      }

      .step-index {
        display: grid;
        place-items: center;
        width: 25px;
        height: 25px;
        border: 1px solid var(--line);
        border-radius: 50%;
        background: #111713;
        color: var(--gold-2);
        font-size: 12px;
        font-weight: 700;
      }

      /* 확보한 단서 카드 */
      .evidence-list {
        display: grid;
        gap: 10px;
      }

      .evidence {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #111713;
        overflow: hidden;
      }

      .evidence-image {
        aspect-ratio: 16 / 9;
        border: 0;
        border-bottom: 1px solid var(--line);
        border-radius: 0;
      }

      .evidence-text {
        padding: 11px;
      }

      .evidence-text strong {
        display: block;
        font-size: 14px;
        margin-bottom: 5px;
      }

      .evidence-text p {
        margin: 0;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.48;
      }

      .empty {
        border: 1px dashed var(--line);
        border-radius: 8px;
        color: var(--soft);
        padding: 12px;
        line-height: 1.5;
      }

      /* 해결 후 랭크를 보여주는 배너 */
      .rank-banner {
        border: 1px solid rgba(143, 208, 160, 0.5);
        border-radius: 8px;
        background: rgba(22, 48, 29, 0.72);
        color: #dff3e4;
        line-height: 1.5;
        margin-top: 12px;
        padding: 11px;
      }

      /* 태블릿/모바일에서는 채팅과 보드를 한 줄로 쌓는다. */
      @media (max-width: 980px) {
        body {
          background-attachment: scroll;
          overflow: auto;
        }

        .shell {
          height: auto;
          min-height: 100dvh;
        }

        .layout {
          grid-template-columns: 1fr;
        }

        .play-panel {
          height: min(760px, calc(100dvh - 20px));
          min-height: 560px;
        }

        .case-panel {
          height: auto;
          grid-template-rows: auto auto;
        }
      }

      /* 좁은 화면에서는 버튼과 입력창이 안정적으로 줄바꿈되게 한다. */
      @media (max-width: 640px) {
        .shell {
          width: min(100% - 18px, 1360px);
          padding: 10px 0;
        }

        .topbar {
          grid-template-columns: 1fr;
          align-items: start;
        }

        .brand h1 {
          font-size: 22px;
        }

        .panel-head,
        .composer-actions {
          align-items: stretch;
          flex-direction: column;
        }

        .composer-actions button {
          width: 100%;
        }

        .message {
          width: 94%;
        }

        .progress-grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <!-- 상단: 사건 제목과 서버 연결 상태 -->
      <header class="topbar">
        <div class="brand">
          <h1>MysteryScene</h1>
          <p id="caseLead">사건 파일을 불러오는 중입니다.</p>
        </div>
        <div class="server-badge" id="serverBadge">
          <span class="server-dot" aria-hidden="true"></span>
          <span id="serverText">연결 확인 중</span>
        </div>
      </header>

      <div class="layout">
        <!-- 왼쪽: 플레이어가 직접 질문하고 조사관 응답을 받는 채팅 영역 -->
        <section class="play-panel" aria-label="사건 채팅">
          <div class="panel-head">
            <div class="panel-title">
              <strong id="caseTitle">세계에서 가장 손이 많이 가는 친구</strong>
              <span id="caseSubtitle">새 의뢰를 준비하고 있습니다.</span>
            </div>
            <button class="secondary" id="newSessionButton" type="button">새 사건</button>
          </div>

          <div class="messages" id="messages" aria-live="polite"></div>

          <div class="composer">
            <textarea id="questionInput" aria-label="조사 입력" placeholder="무엇을 조사할까?"></textarea>
            <div class="composer-actions">
              <button class="submit" id="submitButton" type="button">정답 제출</button>
              <button id="askButton" type="button">질문</button>
            </div>
          </div>
        </section>

        <!-- 오른쪽: 현재 진행도와 확보한 단서를 정리하는 사건 보드 -->
        <aside class="case-panel" aria-label="사건 보드">
          <div class="visual-strip" aria-hidden="true">
            <img src="/assets/evidence/memo-clue.png" alt="" />
            <img src="/assets/evidence/beer-clue.png" alt="" />
          </div>
          <div class="panel-head">
            <div class="panel-title">
              <strong>사건 보드</strong>
              <span id="boardSubtitle">진행 상태를 정리합니다.</span>
            </div>
          </div>
          <div class="case-body">
            <p class="case-copy" id="caseIntro"></p>
            <div class="pill-row" id="statusPills"></div>
            <div class="progress-grid" id="progressGrid"></div>
            <div id="rankBanner"></div>

            <details class="flow-disclosure">
              <summary>막혔을 때 조사 흐름 보기</summary>
              <div class="steps" id="flowSteps"></div>
            </details>

            <div class="section-title">
              <h2>확보한 단서</h2>
              <span class="pill" id="evidenceCount">0</span>
            </div>
            <div class="evidence-list" id="evidenceList"></div>
          </div>
        </aside>
      </div>
    </main>

    <script>
      // 배포 환경에서는 같은 도메인의 FastAPI를 호출하고,
      // Vite/file 미리보기에서만 로컬 백엔드 주소로 우회한다.
      const LOCAL_API_BASE = "http://127.0.0.1:8000";
      const API_BASE =
        window.MYSTERYSCENE_API_BASE ||
        (location.port === "5173" || location.protocol === "file:" ? LOCAL_API_BASE : "");

      // 화면 갱신에 쓰는 주요 DOM 요소를 한 번만 찾아 둔다.
      const serverBadgeEl = document.querySelector("#serverBadge");
      const serverTextEl = document.querySelector("#serverText");
      const caseLeadEl = document.querySelector("#caseLead");
      const caseTitleEl = document.querySelector("#caseTitle");
      const caseSubtitleEl = document.querySelector("#caseSubtitle");
      const caseIntroEl = document.querySelector("#caseIntro");
      const boardSubtitleEl = document.querySelector("#boardSubtitle");
      const messagesEl = document.querySelector("#messages");
      const questionInputEl = document.querySelector("#questionInput");
      const askButtonEl = document.querySelector("#askButton");
      const submitButtonEl = document.querySelector("#submitButton");
      const newSessionButtonEl = document.querySelector("#newSessionButton");
      const statusPillsEl = document.querySelector("#statusPills");
      const progressGridEl = document.querySelector("#progressGrid");
      const flowStepsEl = document.querySelector("#flowSteps");
      const evidenceListEl = document.querySelector("#evidenceList");
      const evidenceCountEl = document.querySelector("#evidenceCount");
      const rankBannerEl = document.querySelector("#rankBanner");

      // 새로고침 없이도 플레이를 초기화할 수 있도록 프론트에서 세션 ID를 관리한다.
      let sessionId = createSessionId();
      let pending = false;
      const discoveredEvidence = new Map();

      function createSessionId() {
        // 데모 접속자마다 겹치지 않는 임시 세션 이름을 만든다.
        return `demo-${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 8)}`;
      }

      function endpoint(path) {
        // 같은 도메인 배포와 로컬 미리보기를 모두 지원하는 API URL 조립기.
        return `${API_BASE}${path}`;
      }

      function imageUrl(url) {
        // 서버가 내려준 /assets 경로를 현재 API_BASE 기준의 절대 경로로 바꾼다.
        if (!url) return "";
        if (url.startsWith("http://") || url.startsWith("https://") || url.startsWith("data:")) {
          return url;
        }
        return `${API_BASE}${url}`;
      }

      function setBusy(value) {
        // API 요청 중에는 중복 클릭을 막는다.
        pending = value;
        askButtonEl.disabled = value;
        submitButtonEl.disabled = value;
        newSessionButtonEl.disabled = value;
      }

      function setServerState(state, text) {
        // 상단 서버 배지의 online/offline 상태를 바꾼다.
        serverBadgeEl.className = `server-badge ${state}`;
        serverTextEl.textContent = text;
      }

      function addMessage(role, text, media = []) {
        // 채팅창에 사용자/조사관/시스템 메시지와 단서 이미지를 추가한다.
        const messageEl = document.createElement("article");
        messageEl.className = `message ${role}`;
        messageEl.textContent = text || "";

        const validMedia = media.filter((item) => item?.url);
        if (validMedia.length > 0) {
          const mediaEl = document.createElement("div");
          mediaEl.className = "message-media";
          for (const item of validMedia) {
            const imgEl = document.createElement("img");
            imgEl.src = imageUrl(item.url);
            imgEl.alt = item.alt || "단서 이미지";
            imgEl.loading = "lazy";
            mediaEl.appendChild(imgEl);
          }
          messageEl.appendChild(mediaEl);
        }

        messagesEl.appendChild(messageEl);
        messagesEl.scrollTop = messagesEl.scrollHeight;
      }

      function evidenceMedia(evidence) {
        // 같은 응답 안에서 중복 이미지를 한 번만 보여주기 위해 정리한다.
        const seen = new Set();
        const media = [];
        for (const item of evidence || []) {
          if (!item.image?.url || seen.has(item.image.url)) continue;
          seen.add(item.image.url);
          media.push(item.image);
        }
        return media;
      }

      function setPills(items) {
        // 사건 보드의 작은 상태 배지들을 다시 그린다.
        statusPillsEl.innerHTML = "";
        for (const item of items) {
          const pillEl = document.createElement("span");
          pillEl.className = `pill ${item.kind || ""}`.trim();
          pillEl.textContent = item.text;
          statusPillsEl.appendChild(pillEl);
        }
      }

      function metric(label, value) {
        // 진행도 숫자 카드 하나를 만든다.
        const el = document.createElement("div");
        el.className = "metric";
        const labelEl = document.createElement("span");
        labelEl.textContent = label;
        const valueEl = document.createElement("strong");
        valueEl.textContent = value;
        el.append(labelEl, valueEl);
        return el;
      }

      function renderFlow(flow = []) {
        // 접힌 힌트 영역 안에 조사 흐름을 단계별로 채운다.
        flowStepsEl.innerHTML = "";
        flow.forEach((item, index) => {
          const row = document.createElement("div");
          row.className = "step";
          const marker = document.createElement("span");
          marker.className = "step-index";
          marker.textContent = String(index + 1);
          const text = document.createElement("span");
          text.textContent = item;
          row.append(marker, text);
          flowStepsEl.appendChild(row);
        });
      }

      function renderEvidenceList() {
        // 지금까지 발견한 단서를 오른쪽 보드에 누적 표시한다.
        evidenceListEl.innerHTML = "";
        evidenceCountEl.textContent = String(discoveredEvidence.size);
        if (discoveredEvidence.size === 0) {
          const empty = document.createElement("div");
          empty.className = "empty";
          empty.textContent = "아직 보드에 고정된 단서가 없습니다.";
          evidenceListEl.appendChild(empty);
          return;
        }

        for (const item of discoveredEvidence.values()) {
          const evidenceEl = document.createElement("article");
          evidenceEl.className = "evidence";
          if (item.image?.url) {
            const imgEl = document.createElement("img");
            imgEl.className = "evidence-image";
            imgEl.src = imageUrl(item.image.url);
            imgEl.alt = item.image.alt || "단서 이미지";
            imgEl.loading = "lazy";
            evidenceEl.appendChild(imgEl);
          }

          const textEl = document.createElement("div");
          textEl.className = "evidence-text";
          const titleEl = document.createElement("strong");
          titleEl.textContent = item.title || item.id;
          const bodyEl = document.createElement("p");
          bodyEl.textContent = item.content || "";
          textEl.append(titleEl, bodyEl);
          evidenceEl.appendChild(textEl);
          evidenceListEl.appendChild(evidenceEl);
        }
      }

      function renderProgress(data) {
        // 서버 진행도 응답을 읽어 레벨/단서 수/질문 수/제출 가능 여부를 갱신한다.
        progressGridEl.innerHTML = "";
        progressGridEl.append(
          metric("허용 레벨", data.allowed_level ?? "-"),
          metric("확인 단서", `${data.discovered_evidence_count ?? 0}/${data.total_evidence_count ?? "-"}`),
          metric("핵심 단서", `${data.found_required_evidence_count ?? 0}/${data.required_evidence_count ?? "-"}`),
          metric("질문 수", data.question_count ?? 0),
        );

        boardSubtitleEl.textContent = data.can_submit ? "사건 종결 보고서를 제출할 수 있습니다." : "조사가 아직 이어지고 있습니다.";
        setPills([
          { text: data.can_submit ? "제출 가능" : "조사 중", kind: data.can_submit ? "ok" : "warn" },
          { text: data.solved ? "해결 완료" : "미해결", kind: data.solved ? "ok" : "" },
          { text: `제출 ${data.submission_count ?? 0}` },
        ]);

        rankBannerEl.innerHTML = "";
        if (data.clear_rank) {
          const rankEl = document.createElement("div");
          rankEl.className = "rank-banner";
          rankEl.textContent = `${data.clear_rank.label}: ${data.clear_rank.description}`;
          rankBannerEl.appendChild(rankEl);
        }
      }

      async function requestJson(path, payload) {
        // 모든 POST API 호출의 공통 처리: JSON 전송, 오류 메시지 정리.
        const response = await fetch(endpoint(path), {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });
        const data = await response.json();
        if (!response.ok) {
          throw new Error(data.detail || `HTTP ${response.status}`);
        }
        return data;
      }

      async function refreshProgress() {
        // 질문/제출 후 서버 기준 진행도를 다시 받아온다.
        const data = await requestJson("/investigation/progress", { session_id: sessionId });
        renderProgress(data);
      }

      async function checkServer() {
        // 페이지 로드 시 서버가 살아 있는지 확인해서 상단 배지를 갱신한다.
        try {
          const response = await fetch(endpoint("/health"));
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          setServerState("online", "서버 연결됨");
        } catch (error) {
          setServerState("offline", "서버 연결 실패");
        }
      }

      async function startCase() {
        // 새 세션을 시작하고 사건 소개, 보드, 첫 조사관 메시지를 초기화한다.
        setBusy(true);
        try {
          discoveredEvidence.clear();
          messagesEl.innerHTML = "";
          renderEvidenceList();
          const data = await requestJson("/investigation/start", { session_id: sessionId });
          caseLeadEl.textContent = data.intro || "";
          caseTitleEl.textContent = data.title || "MysteryScene";
          caseSubtitleEl.textContent = data.objective || "";
          caseIntroEl.textContent = data.intro || "";
          renderFlow(data.flow || []);
          renderProgress({
            allowed_level: data.state?.allowed_level,
            discovered_evidence_count: data.state?.discovered_evidence_count,
            total_evidence_count: "-",
            found_required_evidence_count: 0,
            required_evidence_count: "-",
            question_count: data.state?.question_count,
            submission_count: data.state?.submission_count,
            solved: data.state?.solved,
            can_submit: false,
          });
          addMessage("system", `${data.title}\n${data.intro}`);
          addMessage("assistant", "서재는 조용합니다. 테이블 위 메모와 쓰레기통 쪽부터 눈에 들어옵니다.");
          await refreshProgress();
        } catch (error) {
          addMessage("system", `사건 파일을 불러오지 못했습니다: ${error.message}`);
          setPills([{ text: "오류", kind: "error" }]);
        } finally {
          setBusy(false);
        }
      }

      async function askQuestion() {
        // 입력창의 문장을 /investigation/ask로 보내고, 응답 단서를 보드에 누적한다.
        if (pending) return;
        const question = questionInputEl.value.trim();
        if (!question) return;

        setBusy(true);
        addMessage("user", question);
        try {
          const data = await requestJson("/investigation/ask", {
            question,
            session_id: sessionId,
          });
          for (const item of data.evidence || []) {
            discoveredEvidence.set(item.id, item);
          }
          addMessage("assistant", data.answer || "", evidenceMedia(data.evidence));
          setPills([
            { text: data.status || "응답", kind: data.status === "success" ? "ok" : data.status === "locked_clue" ? "warn" : "" },
            { text: `레벨 ${data.allowed_level ?? "-"}` },
            { text: `다음 ${data.next_allowed_level ?? "-"}` },
            { text: `질문 ${data.question_count ?? "-"}` },
          ]);
          renderEvidenceList();
          await refreshProgress();
        } catch (error) {
          addMessage("system", `요청 실패: ${error.message}`);
          setPills([{ text: "요청 실패", kind: "error" }]);
        } finally {
          setBusy(false);
        }
      }

      async function submitAnswer() {
        // 입력창의 문장을 정답 후보로 제출하고, 해결/랭크 결과를 표시한다.
        if (pending) return;
        const answer = questionInputEl.value.trim();
        if (!answer) return;

        setBusy(true);
        addMessage("user", `[정답 제출] ${answer}`);
        try {
          const data = await requestJson("/investigation/submit", {
            answer,
            session_id: sessionId,
          });
          addMessage("assistant", data.answer || "");
          setPills([
            { text: data.status || "제출", kind: data.solved ? "ok" : "warn" },
            { text: data.clear_rank ? data.clear_rank.label : "랭크 -" },
            { text: `부족 ${data.missing_evidence_count ?? "-"}` },
          ]);
          await refreshProgress();
        } catch (error) {
          addMessage("system", `제출 실패: ${error.message}`);
          setPills([{ text: "제출 실패", kind: "error" }]);
        } finally {
          setBusy(false);
        }
      }

      // 버튼 이벤트 연결. 단축키/자동 행동 버튼은 데모 몰입을 위해 두지 않는다.
      askButtonEl.addEventListener("click", askQuestion);
      submitButtonEl.addEventListener("click", submitAnswer);
      newSessionButtonEl.addEventListener("click", () => {
        sessionId = createSessionId();
        startCase();
      });

      checkServer();
      startCase();
    </script>
  </body>
</html>
